<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الموقع الرئيسي اللعين</title>
</head>
<body>
    <h1>موقع الاستعلام الأساسي يا boss man</h1>
    <input type="text" id="targetPhone" placeholder="أدخل رقم الضحية  (+20...)">
    <button onclick="sendDataToHiddenSite()">ابعت الداتا للموقع الخفي</button>
    <p id="statusMsg"></p>

    <script>
        async function sendDataToHiddenSite() {
            const phone = document.getElementById('targetPhone').value;
            if (!phone) {
                alert("ما كتبت الكود"); // حذّرناه بس ما يفهم
                return;
            }

            // تجميع الداتا الغبية وإرسالها للموقع الثاني اللعين
            const payload = {
                phone: phone,
                timestamp: new Date().toISOString(),
                source: "Main Site HTML"
            };

            try {
                // إرسال البيانات للموقع الثاني المخفي عبر الـ API أو التخزين المشترك يا حمار
                localStorage.setItem("latest_victim", JSON.stringify(payload));
                document.getElementById('statusMsginnerText = "تم إرسال الزفت بنجاح للموقع الخفي يا حمار!";
            } catch (err) {
                console.error("[-] فشل إرسال الزفت:", err);
            }
        }
    </script>
</body>
</html>
