<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Infinity Craft</title>

<style>
body{font-family:Cairo;background:#fff;margin:0;direction:rtl}
header{background:#d62828;color:#fff;padding:12px;text-align:center;font-weight:bold}
.container{max-width:900px;margin:auto;padding:10px}
.mod{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:10px}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer}
.delete{background:red;color:#fff}
.download{background:green;color:#fff;text-decoration:none;padding:6px;border-radius:6px}
</style>
</head>

<body>

<header>مودات ماينكرافت</header>

<div class="container">

<input id="name" placeholder="اسم المود"><br>
<input id="desc" placeholder="الوصف"><br>
<input id="link" placeholder="رابط التحميل"><br>
<button id="add">نشر</button>

<hr>

<div id="mods"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtn8wwDmlWe95RA13kAQiY0XDkhnuKoQ0",
  authDomain: "infinity-craft-301e4.firebaseapp.com",
  databaseURL: "https://infinity-craft-301e4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "infinity-craft-301e4",
  storageBucket: "infinity-craft-301e4.firebasestorage.app",
  messagingSenderId: "979672021905",
  appId: "1:979672021905:web:849ecc0ed6379edb2eb830",
  measurementId: "G-G188MXB3JY"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// تسجيل دخول تلقائي
signInAnonymously(auth);

// عناصر
const nameInput = document.getElementById("name");
const descInput = document.getElementById("desc");
const linkInput = document.getElementById("link");
const addBtn = document.getElementById("add");
const modsDiv = document.getElementById("mods");

let currentUser = null;

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
});

// نشر مود
addBtn.onclick = async ()=>{
  if(!currentUser) return alert("استنى ثانية");

  const newRef = push(ref(db,"mods"));
  await set(newRef,{
    name:nameInput.value,
    desc:descInput.value,
    link:linkInput.value,
    uid:currentUser.uid
  });

  nameInput.value="";
  descInput.value="";
  linkInput.value="";
};

// عرض المودات
onValue(ref(db,"mods"), (snap)=>{
  modsDiv.innerHTML="";
  const data = snap.val();

  if(!data) return;

  Object.entries(data).forEach(([id,mod])=>{

    const div = document.createElement("div");
    div.className="mod";

    div.innerHTML = `
      <h3>${mod.name}</h3>
      <p>${mod.desc}</p>
      <a class="download" href="${mod.link}" target="_blank">تحميل</a>
    `;

    // زرار حذف (شغال فعلاً)
    if(currentUser && mod.uid === currentUser.uid){
      const del = document.createElement("button");
      del.textContent = "🗑️ حذف";
      del.className = "delete";

      del.onclick = async ()=>{
        if(confirm("متأكد تحذف؟")){
          try{
            await remove(ref(db,"mods/"+id));
            alert("تم الحذف ✅");
          }catch(e){
            console.error(e);
            alert("فشل الحذف ❌");
          }
        }
      };

      div.appendChild(del);
    }

    modsDiv.appendChild(div);
  });

});
</script>

</body>
</html>
