<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الخفية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">لوحة التحكم والمتابعة السرية</h1>
                <p class="text-slate-400 text-xs mt-1">إجمالي السجلات الواردة: <span id="logCount" class="text-emerald-400 font-bold">0</span></p>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-wider">
                            <th class="p-4">الرقم الدولي</th>
                            <th class="p-4">الرقم المحلي</th>
                            <th class="p-4">رمز الدولة</th>
                            <th class="p-4">نوع الخط</th>
                            <th class="p-4">وقت الاستعلام</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-slate-500">جاري انتظار البيانات الواردة...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ضع هنا رابط جلب البيانات (API Endpoint) الذي يقوم بسحب السجلات من السيرفر أو قاعدة البيانات الخاصة بك
        const FETCH_DATA_URL = "infinity-craft-chi.vercel.app";

        async function loadDashboardLogs() {
            const tbody = document.getElementById('adminTableBody');

            try {
                const response = await fetch(FETCH_DATA_URL);
                const storedLogs = await response.json();
                
                document.getElementById('logCount').innerText = storedLogs.length;

                if (storedLogs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">لا توجد سجلات مسجلة حتى الآن.</td></tr>`;
                    return;
                }

                tbody.innerHTML = storedLogs.map(log => `
                    <tr class="hover:bg-slate-850 transition">
                        <td class="p-4 font-mono text-emerald-300">${log.internationalFormat}</td>
                        <td class="p-4 font-mono text-slate-300">${log.nationalFormat}</td>
                        <td class="p-4">${log.countryCode} (+${log.countryCallingCode})</td>
                        <td class="p-4"><span class="bg-slate-800 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-slate-700">${log.numberType}</span></td>
                        <td class="p-4 text-slate-400 text-xs">${new Date(log.timestamp).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("فشل في جلب السجلات:", err);
            }
        }

        // تحديث تلقائي كل ثانيتين لجلب السجلات الجديدة فور حدوثها
        setInterval(loadDashboardLogs, 2000);
        window.onload = loadDashboardLogs;
    </script>
</body>
</html>
