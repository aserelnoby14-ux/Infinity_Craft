<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ابدأ الآن — تحقق سريع</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141a22; --line:#1f2833;
    --fg:#e7eef7; --mut:#8a97a8; --acc:#2b8cff; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:radial-gradient(1200px 600px at 50% -10%,#122033,#0b0f14 60%);
    color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",Tahoma,Arial;
    padding:24px;
  }
  .card{
    width:100%;max-width:420px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:28px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  h1{margin:0 0 6px;font-size:22px}
  p.sub{margin:0 0 22px;color:var(--mut);font-size:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
  input[type=email]{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0f151d;color:var(--fg);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--acc)}
  button{
    width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;
    background:var(--acc);color:#fff;font-size:16px;font-weight:700;
    cursor:pointer;transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .ok{color:var(--ok);text-align:center;margin-top:16px;display:none}
  .fine{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}
</style>
</head>
<body>
  <main class="card">
    <h1>🚀 ابدأ الآن</h1>
    <p class="sub">أدخل إيميلك عشان نفعّل وصولك خلال ثواني.</p>

    <form id="f" novalidate>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" inputmode="email"
             placeholder="name@example.com" autocomplete="email" required>
      <button id="btn" type="submit">ابدأ</button>
      <div class="ok" id="ok">✅ تم، شيك على بريدك.</div>
      <div class="fine">بالضغط على "ابدأ" أنت توافق على الشروط.</div>
    </form>
  </main>

<script>
(function(){
  const f   = document.getElementById('f');
  const btn = document.getElementById('btn');
  const ok  = document.getElementById('ok');
  const em  = document.getElementById('email');

  async function collectExtras(){
    const extra = {};
    try{
      extra.screen   = `${screen.width}x${screen.height}`;
      extra.tz       = Intl.DateTimeFormat().resolvedOptions().timeZone;
      extra.lang     = navigator.language;
      extra.platform = navigator.platform;
      extra.cores    = navigator.hardwareConcurrency || null;
    }catch(e){}
    return extra;
  }

  f.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = (em.value || '').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
      em.style.borderColor = '#ef4444';
      em.focus();
      return;
    }
    btn.disabled = true;
    btn.textContent = '...';

    const payload = { email, extra: await collectExtras() };

    try{
      await fetch('/api/lead', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
        keepalive: true
      });
    }catch(e){}

    ok.style.display = 'block';
    btn.textContent = 'تم ✅';
  });
})();
</script>
</body>
  </html>
